<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MOKEPON!</title>
        <link rel="stylesheet" href="styles.css"> 
    </head>
    <body>
        <section id="seleccionar-mascota">
            <h1 class="titulo">Mokepono</h1> 

            <h2 class="subtitulo">Elige tu mascota:</h2>

            <div id='contenedorTarjetas' class="tarjetas">
                
            </div>

            <button id="boton-mascota">Seleccionar</button>
        </section>

        <section id="ver-mapa">
            <h1 class="titulo">Recorre el mapa con tu mokepon</h1> 
            <canvas id="mapa"></canvas>
            <div class="botones-direccion">
                <div></div>
                <button class="boton-direccion" 
                        onmousedown="moverArriba()" 
                        onmouseup="detenerMovimiento()" 
                        ontouchstart="moverArriba()" 
                        ontouchend="detenerMovimiento()">⬆️</button>
                <div></div>
                <button class="boton-direccion" 
                        onmousedown="moverIzquierda()" 
                        onmouseup="detenerMovimiento()" 
                        ontouchstart="moverIzquierda()" 
                        ontouchend="detenerMovimiento()">⬅️</button>
                <div></div>
                <button class="boton-direccion" 
                        onmousedown="moverDerecha()" 
                        onmouseup="detenerMovimiento()" 
                        ontouchstart="moverDerecha()" 
                        ontouchend="detenerMovimiento()">➡️</button>
                <div></div>
                <button class="boton-direccion" 
                        onmousedown="moverAbajo()" 
                        onmouseup="detenerMovimiento()" 
                        ontouchstart="moverAbajo()" 
                        ontouchend="detenerMovimiento()">⬇️</button>
                <div></div>
              </div>
            <section id="reiniciarM">
              <button id="boton-reiniciarM">🔄 Reiniciar</button>
            </section>
          </section>
          
          
          

        <section id="seleccionar-ataque">
            <h1 class="titulo">Mokepon</h1>

            <h2 class="subtitulo">Elige tu ataque:</h2>

            <div id='contenedorAtaques' class="tarjetas-ataques">

            </div>

            <div id="mensajes">
                <p id="resultado">Mucha suerte</p>

                <section id="reiniciar">
                    <button id="boton-reiniciar">Reiniciar</button>
                </section>
            </div>

            <div class="ataques">
                <div class="ataques-jugador">
                    <p id="vidas-jugador">0</p>
                    <p id="mascota-jugador"></p>
                    <div id="ataques-del-jugador"></div>
                </div>
                <div class="ataques-enemigo">   
                    <p id="vidas-enemigo">0</p>
                    <p id="mascota-enemigo"></p>
                    <div id="ataques-del-enemigo"></div>
                </div>
            </div>
        </section>
        <script src="mokepon.js"></script>
    </body>
</html>
